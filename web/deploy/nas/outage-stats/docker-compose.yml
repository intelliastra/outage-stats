services:
  outage-stats:
    build: .
    image: outage-stats:latest
    container_name: outage-stats
    restart: always
    ports:
      - "22229:22229"
    volumes:
      - ./web:/app
      - ./统计材料:/data/统计材料
    environment:
      STATS_BASE: /data/统计材料
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
