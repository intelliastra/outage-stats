services:
  postgres:
    image: postgres:16-alpine
    container_name: outage-stats-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - /mnt/data-disk/outage-stats/postgres-data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
    mem_limit: 768m
    cpus: 2.0
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

